name: Release fork web package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 2.0.1)"
        required: true
        type: string
      dry_run:
        description: "Build and pack without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.6.2

      - name: Resolve and verify version
        id: version
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          case "$VERSION" in
            2.*) ;;
            *) echo "Fork v2 release must use a 2.x version." >&2; exit 1 ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^2\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Version must be an exact semantic version such as 2.0.1." >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$REF_NAME" != "v$VERSION" ]; then
            echo "Tag and release version do not match." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set fork package metadata
        working-directory: packages/web
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          OPENCHAMBER_SDK_VERSION: "2.0.0"
        run: |
          npm pkg set name=@vantran-se/openchamber-web
          npm pkg set version="$RELEASE_VERSION"
          npm pkg set repository.type=git repository.url=git+https://github.com/vantran-se/openchamber.git
          npm pkg set dependencies.@openchamber/sdk="$OPENCHAMBER_SDK_VERSION"

      - name: Validate fork iOS patches
        run: |
          bun run type-check:ui
          bun run lint:ui
          bun test packages/ui/src/components/chat/composer/editor/__tests__/nativeTextarea.test.ts
          bun test packages/ui/src/components/chat/composer/editor/__tests__/dom.test.ts
          bun test packages/ui/src/styles/mobile.test.ts
          bun test packages/web/server/lib/package-manager.test.js
          bun test packages/web/server/lib/spaces/tools.test.js

      - name: Build SDK dependency
        run: bun run --cwd packages/sdk build

      - name: Build web package
        run: bun run build:web

      - name: Create package tarball
        working-directory: packages/web
        run: bun pm pack

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: packages/web
        run: npm publish --access public --provenance

      - name: Publish GitHub release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: packages/web/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
