name: Release npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.22.1)"
        required: true
        type: string
      dry_run:
        description: "Build and pack without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve and verify version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          PACKAGE_VERSION="$(node -p "require('./packages/web/package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release version $VERSION does not match packages/web version $PACKAGE_VERSION." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set fork package name
        working-directory: packages/web
        run: npm pkg set name=@vantran-se/openchamber-web

      - name: Validate
        run: |
          bun run type-check:ui
          bun run lint:ui
          bun test packages/ui/src/components/chat/composer/editor/__tests__/nativeTextarea.test.ts
          bun test packages/ui/src/components/chat/composer/editor/__tests__/dom.test.ts

      - name: Build web package
        run: OPENCHAMBER_PACKAGE_NAME=@vantran-se/openchamber-web bun run build:web

      - name: Create package tarball
        working-directory: packages/web
        run: npm pack

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: packages/web
        run: npm publish --access public --provenance

      - name: Publish GitHub release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: packages/web/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
