name: Release fork web package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: true
        type: string
      dry_run:
        description: Build and pack without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install --global npm@11.6.2

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-${REF_NAME#v}}"
          if ! printf '%s' "$version" | grep -Eq '^2\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Version must be an exact 2.x semantic version." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = push ] && [ "$REF_NAME" != "v$version" ]; then
            echo "Tag and package version do not match." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve published SDK version
        id: sdk
        run: echo "version=$(npm view @openchamber/sdk version --registry https://registry.npmjs.org)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set fork package metadata
        working-directory: packages/web
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
        run: |
          npm pkg set name=@vantran-se/openchamber-web
          npm pkg set version="$RELEASE_VERSION"
          npm pkg set dependencies.@openchamber/sdk="$SDK_VERSION"
          npm pkg set repository.type=git repository.url=git+https://github.com/vantran-se/openchamber.git

      - name: Build web package
        run: bun run build:web

      - name: Pack web package once
        id: pack
        working-directory: packages/web
        run: |
          tarball=$(bun pm pack)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish package
        if: ${{ inputs.dry_run != true }}
        working-directory: packages/web
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance

      - name: Create GitHub release and attach exact tarball
        if: ${{ inputs.dry_run != true }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: packages/web/${{ steps.pack.outputs.tarball }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
