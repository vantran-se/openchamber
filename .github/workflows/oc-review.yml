name: pr checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check UI
        run: bun run type-check:ui

      - name: Lint UI
        run: bun run lint:ui

      - name: Test patched composer behavior
        run: |
          bun test packages/ui/src/components/chat/composer/editor/__tests__/nativeTextarea.test.ts
          bun test packages/ui/src/components/chat/composer/editor/__tests__/dom.test.ts
          bun test packages/ui/src/components/chat/composer/editor/__tests__/writebackCompositionGuard.test.ts

      - name: Build web package
        run: OPENCHAMBER_PACKAGE_NAME=@vantran-se/openchamber-web bun run build:web
